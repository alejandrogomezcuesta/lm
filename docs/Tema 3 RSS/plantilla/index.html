<!-- Declara el tipo de documento HTML5. -->
<!doctype html>
<!-- Inicia el documento e indica que su idioma es español. -->
<html lang="es">
<!-- Abre la sección de metadatos de la página. -->
<head>
  <!-- Define la codificación para mostrar correctamente caracteres en español. -->
  <meta charset="utf-8" />
  <!-- Adapta el ancho de la página a la pantalla del dispositivo. -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Muestra el título de la página en la pestaña del navegador. -->
  <title>Mi servicio RSS</title>
  <!-- Anuncia a los navegadores y lectores la ubicación del feed RSS. -->
  <link rel="alternate" title="RSS" href="feed.xml" type="application/rss+xml" />
<!-- Cierra la sección de metadatos. -->
</head>
<!-- Abre el contenido visible de la página. -->
<body>
  <!-- Presenta el encabezado principal del sitio. -->
  <h1>Mi servicio RSS</h1>
  <!-- Explica brevemente el contenido del sitio. -->
  <p>Bienvenido a mi canal de noticias. Suscríbete al feed para recibir las novedades.</p>
  <!-- Ofrece un enlace directo al fichero RSS para que pueda abrirse desde la página. -->
  <p><a href="feed.xml">Ver el feed RSS</a></p>
<!-- Cierra el contenido visible de la página. -->
</body>
<!-- Cierra el documento HTML. -->
</html>
